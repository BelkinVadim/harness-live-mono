# Конфиг harness-kit. Формат — src/schemas/config.json пакета harness-kit.
# Меняйте через `harness-kit configure`; ручные правки проверяет `harness-kit doctor`.

schema: 1
version: 1.0.0-rc.1
profile: solo-web
level: 2
stack:
  name: web-ts
  options:
    package_manager: pnpm
check_packs:
  - name: design-tokens
agents:
  - codex
  - claude-code
team_size: 1
hosting:
  host: github
  ci: github-actions
  default_branch: main
review:
  reviewer: harness-ci
  self_check:
    runner: claude-session
    auth: session
  pr:
    runner: claude-cli
    auth: subscription-token
    credentials_env: CLAUDE_CODE_OAUTH_TOKEN
  nightly:
    runner: claude-cli
    auth: subscription-token
    credentials_env: CLAUDE_CODE_OAUTH_TOKEN
sensitive_data:
  kinds: []
packages:
  - packages/core
  - packages/web
checks:
  lint:
    mode: observe
  types-core:
    mode: observe
  types-web:
    mode: observe
  structural:
    mode: observe
  tests-core:
    mode: observe
  tests-web:
    mode: observe
  design-tokens:
    mode: observe
  ai-review:
    mode: observe
verify:
  commands:
    - name: lint
      kind: lint
      command: node harness/core/runtime.mjs stack lint
      parser: violations-json
    - name: types-core
      kind: types
      command: node_modules/.bin/tsc --noEmit --pretty false -p packages/core
      parser: tsc
      package: packages/core
    - name: types-web
      kind: types
      command: node_modules/.bin/tsc --noEmit --pretty false -p packages/web
      parser: tsc
      package: packages/web
    - name: structural
      kind: structural
      command: node harness/core/runtime.mjs stack boundaries
      parser: violations-json
    - name: tests-core
      kind: tests
      command: cd packages/core && pnpm run test
      package: packages/core
    - name: tests-web
      kind: tests
      command: cd packages/web && pnpm run test
      package: packages/web
    - name: design-tokens
      kind: lint
      command: node harness/core/runtime.mjs check-pack design-tokens colors
      parser: violations-json
      pack: design-tokens
break_glass:
  default_ttl_hours: 48
